name: Diagnostic Probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe events/keyset endpoint
        run: |
          BASE="https://gamma-api.polymarket.com"
          echo "--- raw keyset response shape (first 800 chars) ---"
          curl -s "$BASE/events/keyset?active=true&closed=false&limit=3" | head -c 800
          echo ""
          echo "--- keyset with a large limit, count items and inspect shape ---"
          curl -s "$BASE/events/keyset?active=true&closed=false&limit=500" -o /tmp/k1.json
          python3 -c "import json; d=json.load(open('/tmp/k1.json')); print('type:', type(d).__name__); print('keys/len:', (list(d.keys()) if isinstance(d,dict) else len(d)))"
          echo "--- try common cursor param names to page past item 500 ---"
          for param in cursor next_cursor after offset_id last_id starting_after; do
            code=$(curl -s -o /tmp/k2.json -w "%{http_code}" "$BASE/events/keyset?active=true&closed=false&limit=100&$param=999999")
            echo "param=$param -> HTTP $code"
          done
          echo "--- does keyset accept a plain numeric offset like the old endpoint, up to a bigger number? ---"
          for off in 2100 5000 10000 20000; do
            code=$(curl -s -o /tmp/k3.json -w "%{http_code}" "$BASE/events/keyset?active=true&closed=false&limit=10&offset=$off")
            n=$(python3 -c "import json; d=json.load(open('/tmp/k3.json')); print(len(d) if isinstance(d,list) else d)" 2>/dev/null)
            echo "offset=$off -> HTTP $code, items=$n"
          done
