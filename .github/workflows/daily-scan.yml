name: Daily Polymarket Scan

on:
  schedule:
    # 03:00 UTC = 06:00 Turkey time (UTC+3). Edit this line to change it.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scan
        run: python scripts/fetch_arbitrage.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          if [ -f docs/price_log.jsonl ]; then
            git add docs/price_log.jsonl
          fi
          if git diff --staged --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "Daily scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
