name: Daily Polymarket Scan

on:
  schedule:
    # 03:00 UTC = 06:00 Turkey time (UTC+3). Edit this line to change it.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/fetch_arbitrage.py

      - name: Track paper-trading bets
        run: python scripts/track_bets.py

      - name: Check scan health
        id: health
        run: |
          set +e
          python3 scripts/check_scan_health.py > /tmp/health_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/health_output.txt

      - name: File or update scan-health issue
        if: steps.health.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create scan-health --color d93f0b \
            --description "Automated alert from the daily scan's health check" 2>/dev/null || true
          BODY="$(cat /tmp/health_output.txt)"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label scan-health --state open \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Scan health anomaly detected" \
              --label scan-health --body "$BODY"
          fi

      - name: Close scan-health issue if healthy again
        if: steps.health.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label scan-health --state open \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Scan health back to normal as of $(date -u +'%Y-%m-%d %H:%M UTC')."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          if [ -f docs/price_log.jsonl ]; then
            git add docs/price_log.jsonl
          fi
          if [ -f docs/bet_log.json ]; then
            git add docs/bet_log.json
          fi
          if [ -f docs/scan_health.json ]; then
            git add docs/scan_health.json
          fi
          if git diff --staged --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "Daily scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # main may have moved since checkout (this job does several
            # network-bound steps first). Rebase onto the latest before
            # pushing, with a few retries, instead of losing the whole
            # run's work to a rejected non-fast-forward push.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" = true ]; then
              echo "PUSHED=true" >> "$GITHUB_ENV"
            else
              echo "::error::Failed to push after 3 attempts"
              exit 1
            fi
          fi

      - name: Trigger Pages deploy
        if: env.PUSHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push made with the default GITHUB_TOKEN does not trigger other
          # workflows' `on: push` (GitHub's anti-recursion safeguard), so the
          # docs/**-triggered Pages deploy never fires on its own here.
          # Dispatch it explicitly instead.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
