name: Diagnostic Scan (throwaway, relaxed thresholds)

on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan (does not commit; results uploaded as an artifact only)
        run: python scripts/fetch_arbitrage.py

      - name: Upload results.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-results
          path: docs/results.json
          retention-days: 3
